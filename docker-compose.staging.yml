version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:6
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn zayidni.wsgi:application --bind 0.0.0.0:8000 --workers 4
    env_file:
      - .env.staging
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - static_volume:/app/static

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A zayidni worker -l info
    env_file:
      - .env.staging
    depends_on:
      - db
      - redis
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A zayidni beat -l info
    env_file:
      - .env.staging
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  db_data:
  static_volume:
